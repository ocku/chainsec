name: chainsec — dependency chain supply audit
description: Audit the current project dependency chain with chainsec
author: ocku
branding:
  icon: shield
  color: orange

inputs:
  max-package-depth:
    description: "Maximum dependency traversal depth"
    required: false
    default: "2"
  fail-on:
    description: "Finding threshold for exit code 1 (low, medium, high, critical)"
    required: false
    default: "high"
  format:
    description: "Report format (human, json)"
    required: false
    default: "human"
  allow-host:
    description: >
      Additional hosts to allow, space-separated.
      Example: "pypi.org files.pythonhosted.org registry.npmjs.org"
    required: false
    default: ""
  config-dir:
    description: >
      Directory containing chainsec.toml, relative to the repository root.
      Defaults to the repository root.
    required: false
    default: "."
  cache:
    description: "Cache directory for dependency source"
    required: false
    default: ".chainsec-cache"
  threads:
    description: "Maximum concurrency for downloads and analysis"
    required: false
    default: "16"

runs:
  using: docker
  image: docker://ghcr.io/ocku/chainsec:latest
  entrypoint: /bin/sh
  args:
    - -c
    - |
      set -e

      CONFIG_DIR="$GITHUB_WORKSPACE/${{ inputs.config-dir }}"
      if [ ! -f "$CONFIG_DIR/chainsec.toml" ]; then
        echo "::warning::No chainsec.toml found in $CONFIG_DIR. Running with CLI defaults only."
      fi

      cd "$CONFIG_DIR"

      ALLOW_HOST_ARGS=""
      if [ -n "${{ inputs.allow-host }}" ]; then
        for host in ${{ inputs.allow-host }}; do
          ALLOW_HOST_ARGS="$ALLOW_HOST_ARGS --allow-host $host"
        done
      fi

      chainsec scan . \
        --online \
        --max-package-depth "${{ inputs.max-package-depth }}" \
        --fail-on "${{ inputs.fail-on }}" \
        --format "${{ inputs.format }}" \
        --threads "${{ inputs.threads }}" \
        --cache "${{ inputs.cache }}" \
        $ALLOW_HOST_ARGS